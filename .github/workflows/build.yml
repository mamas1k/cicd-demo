name: Build and Push Docker Image

# Тригер: запускати конвеєр при кожному push у гілку main
on:
  push:
    branches: [ "main" ]

# Дозволи для робота: читати код і записувати готовий образ на склад GitHub
permissions:
  contents: read
  packages: write

jobs:
  build:
    # Який тимчасовий комп'ютер (раннер) взяти для роботи
    runs-on: ubuntu-latest

    steps:
      # Крок 1: Завантажити свіжий код із репозиторію на раннер
      - name: Скачати код репозиторію
        uses: actions/checkout@v4

      # Крок 2: Авторизуватися на складі образів GitHub (ghcr.io)
      - name: Увійти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Крок 3: Зібрати Docker-образ і відправити його на склад
      - name: Зібрати та опублікувати Docker-образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
