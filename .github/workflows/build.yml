name: Build, Test and Push Docker Image

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Скачати код репозиторію
        uses: actions/checkout@v4

      - name: 2. Зібрати тестовий образ локально на раннері
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: test-site:local

      - name: 3. Димовий тест (перевірка роботи сайту)
        run: |
          docker run -d --name smoke-test -p 8080:80 test-site:local
          sleep 2
          curl -sf http://localhost:8080 | grep -q "Version"

      - name: 4. Увійти в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 5. Опублікувати перевірений образ на склад
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
